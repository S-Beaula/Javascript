<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <link rel="stylesheet" href="QG.css">
</head>
<body>
  <div class="quiz-container">
    <h1>Quiz App</h1>
    <div id="quiz">
      <div id="question">Question text goes here</div>
      <ul class="answers">
        <li><button class="answer">Answer 1</button></li>
        <li><button class="answer">Answer 2</button></li>
        <li><button class="answer">Answer 3</button></li>
        <li><button class="answer">Answer 4</button></li>
      </ul>
    </div>
    <button id="next-btn">Next</button>
    <div id="result" class="hidden">Your Score: <span id="score">0</span></div>
  </div>
  <script src="QG.js"></script>
</body>
</html>
